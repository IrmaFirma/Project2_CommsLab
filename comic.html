<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Brew and the Beak - Main</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- used this documentation to learn about the figure element: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/figure -->
  <!-- used this documentation to learn about the figcaption element: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/figcaption -->
  <!-- used this documentation to learn about the footer element: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/footer -->


  <header class="site-header">
    <h1><a href="index.html">The Brew and the Beak</a></h1>

    <!-- navigation links to the welcome page, each comic page and the credits -->
    <nav>
      <a href="index.html">Home</a>
      <a href="#team">Team</a>
    </nav>
  </header>

  <main>

<main>

    <!-- PAGE 1: a click-through, narrated sequence  -->
    <!-- "stage" holds one picture at a time; clicking or, for some steps, waiting advances
         it to the next panel in the page.  -->
    <section class="page page-stage" id="page-1">

      <figure class="panel stage" id="story-stage">

        <img class="stage-layer active" id="stage-img-a" src="assets/page1_panel1.png">
        <img class="stage-layer" id="stage-img-b" src="assets/page1_panel2.png">

        <!-- placeholder smoke transition: swap for the real cloud/smoke asset later -->
        <div class="smoke" id="smoke-overlay">
          <div class="smoke-circle left"></div>
          <div class="smoke-circle right"></div>
        </div>

        <!-- opening line, shown over the smoke -->
        <div class="smoke-line" id="smoke-caption">
          <p id="smoke-caption-text"></p>
        </div>

        <!-- every line after that -->
        <figcaption id="stage-caption">Write the line here</figcaption>

      </figure>

    </section>

    <!-- PAGE 2: the owl -->
    <!-- "page-stage" isn't the stage from page 1 - just regular look reused
         since page 2 is just one full-width panel for now -->
    <section class="page page-stage" id="page-2">

      <!-- panel 1 and the two choices share the same spot: panel 1 fades
           out and the choices fade in over it when it's clicked. which
           pathway the reader picks comes later. -->
      <div class="p-owl-wrap">

        <!-- panel 1: click to move on to the choice. the cape is a separate
             layer on top so it can flutter on hover without moving him -->
        <figure class="panel p-owl" id="owl-panel">
          <img src="assets/page2_panel1_capeless.png">
          <img class="cape-layer" src="assets/page2_panel1_cape.png" alt="">
        </figure>

        <!-- the two choices, hidden until panel 1 is clicked -->
        <div class="choice-row" id="choice-row">
          <figure class="panel p-choice" id="choice-a">
            <img src="assets/page2_optionA.jpg">
            <figcaption>Choice A: Greed Over Bond</figcaption>
          </figure>

          <figure class="panel p-choice" id="choice-b">
            <img src="assets/page2_optionB.jpg">
            <figcaption>Choice B: True Respect</figcaption>
          </figure>
        </div>

      </div>

    </section>

    <!-- PAGE 3: panel 1, then a zoom into panel 2 on click, then a plain
         crossfade into panel 3 on the next click -->
    <section class="page page-stage" id="page-3">
      <figure class="panel stage" id="page3-stage">
        <img class="stage-layer active" id="page3-img-a" src="assets/page3_panel1.png">
        <img class="stage-layer" id="page3-img-b" src="assets/page3_panel2.png">
      </figure>
    </section>

    <!-- COFFEE FLOOD: click the picture and the coffee rises by itself -->
    <section class="page page-stage" id="page-flood">
      <figure class="panel">
        <img id="flood-img" src="assets/flood1.jpg">
      </figure>
    </section>

  </main>

  <footer class="site-footer" id="team">
    <p>Mariam, Dina and Irma</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
